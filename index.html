<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Are You Okay?</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
      background-color: #f0f8ff;
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      margin: 10px;
      cursor: pointer;
    }
    .yes-button {
      background-color: green;
      color: white;
    }
    .no-button {
      background-color: #f44336;
      color: white;
    }
    .next-button {
      background-color: pink;
      color: white;
    }
    #response {
      margin-top: 30px;
      font-size: 24px;
      color: #333;
    }
    #second-question {
      margin-top: 40px;
      font-size: 22px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Hey, are you okay?</h1>
  <div id="first-buttons">
    <button class="yes-button" onclick="respondYes()">Yes</button>
    <button class="no-button" onclick="respondNo()">No</button>
  </div>

  <div id="response"></div>

  <div id="second-question">
    <p>Can i tell you something?</p>
    <button class="next-button" onclick="answerBirds()">Sure(if you don't wanna know you can just leave the site:)</button>
    <div id="bird-response"></div>
  </div>

  <!-- Audio element -->
  <audio id="ITO NA" src="/storage/emulated/O/idk/ITO NA.mp3"></audio>

  <script>
    function respondYes() {
      document.getElementById("response").innerText = "I'm really really glad to know that you're doing well po. I hope bad days will stay far away from you. ";
      document.getElementById("first-buttons").style.display = "none";
      showSecondQuestion();
    }

    function respondNo() {
      document.getElementById("response").innerText = "I'm sorry to hear that. I hope your days will become better as the year progresses. If you wanna talk about it, I'm here to lend an ear and give you whatever you need.";
      document.getElementById("first-buttons").style.display = "none";
      showSecondQuestion();
    }

    function showSecondQuestion() {
      document.getElementById("second-question").style.display = "block";
    }

    function answerBirds() {
      document.getElementById("bird-response").innerText = "Alright then, these past few days I'm still in shock of what happened. I realized I should've opened up to you when I had the chance. I really regret wasting the chance you had given me. Pretty short isn't it haha, well I hope it's the right timing to send this stuff to you. While writing this right now, I'm literally just sitting on a curb, listening to music while staring at the sky. In short, nakatulala lang talaga Ako habang iniisip kung ano pang pwedeng sabihin dito. Pretty peaceful outside when it's dark and cold, you can see alot of stars just shimmering their light which is really nice and relaxing. Sorry for such a random message, I really hope you're in the best form of yourself, but like if you pressed the no button then you're probably not fine so if you ever start to wonder, charot I meant if you ever find yourself in a tough situation, breathe and just do what you do best, though I don't really know what you do best. Well this is it, I hope this message reaches you when you least expect it.";
      document.getElementById("ITO NA").play();
    }
  </script>

</body>
</html>
