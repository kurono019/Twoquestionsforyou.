<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Are You Okay?</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 80px 20px;
      background-color: pink;
      color: #333;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 30px;
    }

    button {
      padding: 14px 28px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      margin: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .yes-button {
      background-color: #4caf50;
      color: white;
    }

    .no-button {
      background-color: #f44336;
      color: white;
    }

    .next-button {
      background-color: green;
      color: white;
    }

    #response,
    #second-question,
    #bird-response {
      display: none;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 500px;
      font-size: 16px;
      line-height: 1.6;
      margin: 20px auto;
      text-align: left;
    }
  </style>
</head>

<body>
  <h1>Hey, are you okay?</h1>

  <div id="first-buttons">
    <button class="yes-button" onclick="respondYes()">Yes</button>
    <button class="no-button" onclick="respondNo()">No</button>
  </div>

  <div id="response"></div>

  <div id="second-question">
    <p>Can I tell you something?</p>
    <button class="next-button" onclick="answerBirds()">Sure (if you don't wanna know you can just leave the site :) )</button>
    <div id="bird-response"></div>
  </div>

  <audio id="ITO NA" src="/storage/emulated/O/idk/ITO NA.mp3"></audio>

  <script>
    function respondYes() {
      const response = document.getElementById("response");
      response.innerText = "I'm really really glad to know that you're doing well po. I hope bad days will stay far away from you.";
      response.style.display = "block";  // Show response
      document.getElementById("first-buttons").style.display = "none";
      showSecondQuestion();
    }

    function respondNo() {
      const response = document.getElementById("response");
      response.innerText = "I'm sorry to hear that. I hope your days will become better as the year progresses. If you wanna talk about it, I'm here to lend an ear and give you whatever you need.";
      response.style.display = "block";  // Show response
      document.getElementById("first-buttons").style.display = "none";
      showSecondQuestion();
    }

    function showSecondQuestion() {
      document.getElementById("second-question").style.display = "block";
    }

    function answerBirds() {
      const birdMsg = `Alright then, these past few days I'm still in shock of what happened. I realized I should've opened up to you when I had the chance. I really regret wasting the chance you had given me. Pretty short isn't it haha, well I hope it's the right timing to send this stuff to you. While writing this right now, I'm literally just sitting on a curb, listening to music while staring at the sky. In short, nakatulala lang talaga Ako habang iniisip kung ano pang pwedeng sabihin dito. Pretty peaceful outside when it's dark and cold, you can see alot of stars just shimmering their light which is really nice and relaxing. Sorry for such a random message, I really hope you're in the best form of yourself, but like if you pressed the no button then you're probably not. So if you ever start to wonder, charot I meant if you ever find yourself in a tough situation, breathe and just do what you do best, though I don't really know what you do best. Well this is it, I hope this message reaches you when you least expect it.`;

      const birdResponse = document.getElementById("bird-response");
      birdResponse.innerText = birdMsg;
      birdResponse.style.display = "block";  // Show bird message

      document.getElementById("ITO NA").play();
    }
  </script>
</body>

</html>
